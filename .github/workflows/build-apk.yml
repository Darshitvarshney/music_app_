name: Build Dirito APK

# Manual only: GitHub -> Actions -> "Build Dirito APK" -> Run workflow.
on:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
      # Tests are kept local only (git-ignored), so only run them if a test folder exists
      - run: if [ -d test ]; then flutter test; else echo "No test folder, skipping tests"; fi
      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: dirito-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7
